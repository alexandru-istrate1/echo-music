<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Echo — {{ tag }}</title>
    <style>
        body { font-family: Tahoma, Verdana, Arial, sans-serif; background-color: #e9e9e9; color: #111; margin: 0; padding: 0; font-size: 13px; }
        .top-bar { background-color: #d51007; color: white; padding: 10px 20px; border-bottom: 4px solid #8a0a04; }
        .top-bar h1 { margin: 0; font-size: 24px; letter-spacing: -1px; }
        .container { width: 80%; max-width: 900px; margin: 20px auto; background-color: #ffffff; border: 1px solid #bcbcbc; padding: 20px; }
        h2 { border-bottom: 1px solid #ccc; padding-bottom: 5px; color: #d51007; font-size: 16px; margin-top: 0; }
        .back-link { color: #003399; text-decoration: none; font-weight: bold; display: inline-block; margin-bottom: 15px; }
        .back-link:hover { text-decoration: underline; color: #d51007; }
        .genre-title { text-transform: uppercase; letter-spacing: 1px; }
        table.results-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        table.results-table th { background-color: #f0f0f0; border-bottom: 2px solid #ccc; text-align: left; padding: 8px; font-size: 11px; text-transform: uppercase; color: #555; }
        table.results-table td { padding: 8px; border-bottom: 1px solid #eee; vertical-align: middle; }
        table.results-table tr:hover { background-color: #fef8f8; }
        .rank-cell { color: #999; font-weight: bold; width: 30px; }
        .play-link { color: #d51007; text-decoration: none; font-size: 11px; font-weight: bold; }
        .play-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="top-bar">
        <h1>Echo</h1>
    </div>

    <div class="container">
        <a href="/" class="back-link">← Back to search</a>

        <h2>Top tracks tagged <span class="genre-title">{{ tag }}</span></h2>

        {% if piese %}
            <table class="results-table">
                <thead>
                    <tr><th>#</th><th>Track</th><th>Artist</th><th>Action</th></tr>
                </thead>
                <tbody>
                    {% for piesa in piese %}
                    <tr>
                        <td class="rank-cell">{{ loop.index }}</td>
                        <td><strong>{{ piesa.name }}</strong></td>
                        <td>{{ piesa.artist }}</td>
                        <td><a href="{{ piesa.url }}" target="_blank" class="play-link">LAST.FM ↗</a></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        {% else %}
            <p>No tracks found for this tag.</p>
        {% endif %}
    </div>
</body>
</html>
