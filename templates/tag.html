<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo — {{ tag }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="top-bar">
        <div>
            <span class="logo">Echo</span>
            
        </div>
    </div>

    <div class="container">
        <a href="/" class="back-link">← Back to search</a>

        <div class="section-bar">Top tracks tagged "{{ tag }}"</div>
        <div class="panel" style="padding:0;">
            {% if piese %}
                <table class="results">
                    <thead>
                        <tr><th class="num">#</th><th>Track</th><th>Artist</th><th>Action</th></tr>
                    </thead>
                    <tbody>
                        {% for piesa in piese %}
                        <tr>
                            <td class="num">{{ loop.index }}</td>
                            <td><a href="{% if piesa.spotify_id %}/track/{{ piesa.spotify_id }}{% else %}{{ piesa.url }}{% endif %}"
                                   {% if not piesa.spotify_id %}target="_blank"{% endif %} class="track-link">{{ piesa.name }}</a></td>
                            <td>{{ piesa.artist }}</td>
                            <td>
                                {% if piesa.spotify_id %}
                                    <a href="/track/{{ piesa.spotify_id }}" class="action">VIEW ↗</a>
                                {% else %}
                                    <a href="{{ piesa.url }}" target="_blank" class="action">LAST.FM ↗</a>
                                {% endif %}
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            {% else %}
                <p style="padding:12px;">No tracks found for this tag.</p>
            {% endif %}
        </div>
    </div>

</body>
</html>
